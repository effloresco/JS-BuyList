<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BuyList</title>
	<link rel="stylesheet" href="main.css">
</head>

<body>

	<div class="app-wrapper">
		<main class="main-container">
			<section class="card buy-panel">
				<div class="input-group">
					<input type="text" placeholder="Назва товару" aria-label="Введіть назву товару">
					<button class="btn-add" data-tooltip="Додати товар у список">Додати</button>
				</div>

				<ul class="product-list">
					<li class="product-row is-bought">
						<span class="product-name">Помідори</span>
						<div class="controls">
							<span class="count-label">2</span>
						</div>
						<div class="actions">
							<button class="btn-status" data-tooltip="Скасувати покупку">Не куплено</button>
						</div>
					</li>

					<li class="product-row">
						<span class="product-name">Печиво</span>
						<div class="controls">
							<button class="btn-round btn-minus" data-tooltip="Зменшити кількість"
								aria-label="Зменшити">−</button>
							<span class="count-label">2</span>
							<button class="btn-round btn-plus" data-tooltip="Збільшити кількість"
								aria-label="Збільшити">+</button>
						</div>
						<div class="actions">
							<button class="btn-status" data-tooltip="Позначити як куплене">Куплено</button>
							<button class="btn-remove" data-tooltip="Видалити" aria-label="Видалити">×</button>
						</div>
					</li>

					<li class="product-row">
						<input type="text" class="edit-input" value="Сир" aria-label="Редагувати назву">
						<div class="controls">
							<button class="btn-round btn-minus disabled" disabled>−</button>
							<span class="count-label">1</span>
							<button class="btn-round btn-plus" data-tooltip="Збільшити">+</button>
						</div>
						<div class="actions">
							<button class="btn-status" data-tooltip="Позначити як куплене">Куплено</button>
							<button class="btn-remove" data-tooltip="Видалити">×</button>
						</div>
					</li>
				</ul>
			</section>

			<aside class="card stats-panel">
				<div class="stats-group">
					<h3 class="stats-title">Залишилося</h3>
					<div class="stats-content">
						<span class="tag">Печиво <span class="tag-count">2</span></span>
						<span class="tag">Сир <span class="tag-count">1</span></span>
					</div>
				</div>

				<div class="stats-group">
					<h3 class="stats-title">Куплено</h3>
					<div class="stats-content">
						<span class="tag bought">Помідори <span class="tag-count">2</span></span>
					</div>
				</div>

			</aside>
		</main>
	</div>

	<div class="badge" tabindex="0">
		<div class="badge-content">
			<span class="badge-main-text">BuyList</span>
			<span class="badge-author-text">Created by: Oleksandr Zaionchkivskyi</span>
		</div>
	</div>

</body>

</html>
